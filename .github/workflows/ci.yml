name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore ADA.sln

      - name: Build
        run: dotnet build ADA.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test ADA.sln --configuration Release --no-build --logger "trx;LogFileName=results.trx"

      # The real OS secret store, which the main test step skips. Separate, so a keyring problem on a
      # runner can't hide other failures. macOS is checked locally: its runner keychain can prompt.
      - name: Secret store (Windows)
        if: runner.os == 'Windows'
        env:
          ADA_TEST_SECRET_STORE: '1'
        run: dotnet test ADA.Tests --configuration Release --no-build --filter "FullyQualifiedName~SecretStoresTests"

      - name: Secret store (Linux)
        if: runner.os == 'Linux'
        env:
          ADA_TEST_SECRET_STORE: '1'
        run: |
          sudo apt-get update
          sudo apt-get install -y gnome-keyring libsecret-tools dbus-x11
          dbus-run-session -- sh -c 'echo -n ci | gnome-keyring-daemon --unlock --components=secrets && dotnet test ADA.Tests --configuration Release --no-build --filter "FullyQualifiedName~SecretStoresTests"'

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: '**/TestResults/*.trx'
